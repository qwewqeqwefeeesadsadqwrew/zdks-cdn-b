       第一次打开边玩边缓存；之后进关命中本地缓存。

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      // 必须用绝对 URL：页面有 <base href="阿里云 OSS">，相对路径 'sw.js' 会被解析成
      // OSS 地址 → 跨域 → SW 注册直接失败（实测 SecurityError）。
      var base = 'https://qwewqeqwefeeesadsadqwrew.github.io/zdks-cdn-b/WLZS/ZBAds/web-mobile/';
      navigator.serviceWorker.register(base + 'sw.js', { scope: base })
        .catch(function (e) { console.warn('[sw] 注册失败', e); });
    });
  }
  </script>

      localStorage.setItem('WoLaiZhangShaoV1_lastSignInTime', String(Date.now()));
    } catch (e) {}
    var base = window.__ZLZS_OSS_ROOT || location.href.replace(/WLZS\/ZBAds\/web-mobile\/.*$/, '');
    var t = setInterval(function () {
      try {
        var mcc = window.__require && window.__require('mCore').mcc;
        if (!mcc || !mcc.vestBagMgr) return;
        if (!mcc.vestBagMgr.__zlzsPatched) {
          Object.defineProperty(mcc.vestBagMgr, 'remoteUrl', {
            get: function () { return base; },
            configurable: true
          });
          mcc.vestBagMgr.__zlzsPatched = true;
        }
        clearInterval(t);
      } catch (e) {}
    }, 25);
  })();
  </script>

          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);

<!-- 线上原版见 game-autoplay/references/case-wlzs-zbads.md 的交付记录 -->

<script>
(function () {
  var tip = document.getElementById('zlzs-tip');
  var tip2 = document.getElementById('zlzs-tip2');
  var t0 = Date.now();
  var n = 0;
  var XO2 = XMLHttpRequest.prototype.open;
  var count = 0;
  var origSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function () {
    var xhr = this;
    count++;
    try {
      xhr.addEventListener('loadend', function () {
        n++;
        if (tip2 && tip && tip.style.display !== 'none') {
          var sec = Math.round((Date.now() - t0) / 1000);
          tip2.textContent = '已完成 ' + n + ' 个 · 已用 ' + sec + ' 秒';
        }
      });
    } catch (e) {}
    return origSend.apply(this, arguments);
  };
  var iv = setInterval(function () {
    var d = window.__zlzsDemo;
    var state = null;
    try { state = JSON.parse(d.status()).state; } catch (e) {}
    if (state === 'play') { if (tip) tip.style.display = 'none'; clearInterval(iv); }
    else if (state === 'loading' || state === 'boot') {
      var sec = Math.round((Date.now() - t0) / 1000);
      if (tip2) tip2.textContent = '已用 ' + sec + ' 秒 · 已收到 ' + n + ' 个资源';
    }
  }, 1000);
})();
</script>
